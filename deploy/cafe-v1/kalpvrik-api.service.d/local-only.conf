[Unit]
After=
After=postgresql.service
Wants=

[Service]
Environment=KALPVRIK_ENV_FILE=/etc/kalpvrik/local-hub.env
ExecStartPre=/opt/kalpvrik/backend/.venv/bin/python /opt/kalpvrik/scripts/check_cafe_v1.py --preflight
ExecStart=
ExecStart=/opt/kalpvrik/backend/.venv/bin/uvicorn operational_server:app --host 127.0.0.1 --port 8000 --workers 2
