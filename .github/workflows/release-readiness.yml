name: Release Readiness

on:
  push:
    branches:
      - agent/release-readiness-finalization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_retail_bi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hybrid_retail_bi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEPLOYMENT_MODE: local_hub
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
      LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
      LOCAL_BACKUP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hybrid_retail_bi
      CLOUD_RUNTIME_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
      CLOUD_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
      HC4_TEST_CLOUD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
      HC3_TEST_CLOUD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
      HC2_TEST_CLOUD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
      SECRET_KEY: github-actions-release-readiness-only
      KALPVRIK_BACKUP_ROOT: /tmp/kalpvrik-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
      - name: Create isolated cloud database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE hybrid_cloud_coordination;"
      - name: Apply local and cloud migrations
        working-directory: backend
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic_cloud.ini upgrade head
      - name: Verify independent release migration heads
        working-directory: backend
        run: |
          test "$(alembic -c alembic.ini heads | awk '{print $1}')" = "20260821_0019"
          test "$(alembic -c alembic_cloud.ini heads | awk '{print $1}')" = "20260821_cloud_0003"
          test "$(alembic -c alembic.ini heads | awk '{print $1}')" != "$(alembic -c alembic_cloud.ini heads | awk '{print $1}')"
      - name: Run release security and synchronization tests
        working-directory: backend
        run: >-
          python -m pytest -q --disable-warnings
          tests/test_r9_mfa.py
          tests/test_hc3_cloud_order_convergence.py
          tests/test_hc3_worker_restart.py
          tests/test_hc4_recovery.py
          tests/test_hc4_reconciliation.py
          tests/test_cafe_billing_idempotency.py
          tests/test_cafe_billing_stock.py
          tests/test_company_scope_auth.py
          tests/test_cross_venture_isolation.py
      - name: Run complete backend regression
        working-directory: backend
        run: python -m pytest -q --disable-warnings
      - name: Compile Python release paths
        working-directory: backend
        run: python -m compileall -q app scripts operational_server.py server.py
      - name: Validate Linux deployment scripts
        run: |
          bash -n scripts/backup_postgres.sh
          bash -n scripts/check_local_hub.sh
          python -m py_compile scripts/serve_spa.py
      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt
      - name: Create verified Local Hub backup
        env:
          PGPASSWORD: postgres
        run: bash scripts/backup_postgres.sh
      - name: Restore backup into disposable PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: |
          DUMP="$(find /tmp/kalpvrik-backups -type f -name '*.dump' | sort | tail -n1)"
          test -n "$DUMP"
          sha256sum -c "${DUMP}.sha256"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE hybrid_retail_bi_restore;"
          pg_restore -h localhost -U postgres -d hybrid_retail_bi_restore --no-owner --no-privileges "$DUMP"
          test "$(psql -h localhost -U postgres -d hybrid_retail_bi_restore -tAc 'SELECT version_num FROM alembic_version')" = "20260821_0019"
          psql -h localhost -U postgres -d hybrid_retail_bi_restore -tAc "SELECT to_regclass('public.users') IS NOT NULL" | grep -q t
          psql -h localhost -U postgres -d hybrid_retail_bi_restore -tAc "SELECT to_regclass('public.sync_inbox') IS NOT NULL" | grep -q t

  frontend-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify browser source has no server-only secrets
        run: >-
          ! grep -R -E
          'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|CLOUD_RUNTIME_DATABASE_URL|CLOUD_MIGRATION_DATABASE_URL|SYNC_DEVICE_SECRET|X-Device-Proof'
          frontend/src frontend/.env.example
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build hosted frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4173/api
          VITE_CLOUD_API_BASE_URL: http://127.0.0.1:4173/api
          VITE_OPERATIONAL_API_BASE_URL: http://127.0.0.1:4173/api
        run: npm run build
      - name: Install browser smoke runner
        working-directory: frontend
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser release smoke
        working-directory: frontend
        run: npx playwright test --config=playwright.release.config.mjs
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
