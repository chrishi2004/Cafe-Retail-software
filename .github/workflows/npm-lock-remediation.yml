name: NPM Lock Remediation

on:
  push:
    branches:
      - agent/release-readiness-finalization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-readiness-finalization
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply compatible npm audit fixes to lockfile
        working-directory: frontend
        run: npm audit fix --package-lock-only
      - name: Verify remediated production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Commit exact verified lockfile when changed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already contains the compatible audit remediation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: remediate frontend dependency audit"
          git push origin HEAD:agent/release-readiness-finalization
