name: P1 Multi-Venture Schema Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_retail_bi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hybrid_retail_bi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The V1 preservation tests inspect an ancestor commit.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Upgrade legacy database through HC1
        working-directory: backend
        env:
          DEPLOYMENT_MODE: local_hub
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          SECRET_KEY: github-actions-p1-only
        run: alembic -c alembic.ini upgrade 20260811_0007
      - name: Insert legacy preservation fixture
        working-directory: backend
        env:
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
        run: python scripts/verify_p1_migration.py prepare
      - name: Apply P1 migration
        working-directory: backend
        env:
          DEPLOYMENT_MODE: local_hub
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          SECRET_KEY: github-actions-p1-only
        run: alembic -c alembic.ini upgrade head
      - name: Verify legacy identifiers and totals survived P1
        working-directory: backend
        env:
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
        run: python scripts/verify_p1_migration.py verify
      - name: Verify local and cloud migration heads remain separated
        working-directory: backend
        env:
          DEPLOYMENT_MODE: local_hub
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          SECRET_KEY: github-actions-p1-only
        run: |
          alembic -c alembic.ini heads
          alembic -c alembic_cloud.ini heads
      - name: Run P1 targeted tests
        working-directory: backend
        run: >-
          python -m pytest -q --disable-warnings
          tests/test_multi_venture_schema.py
          tests/test_multi_venture_migrations.py
          tests/test_scope_constraints.py
          tests/test_auth.py
          tests/test_master_data.py
          tests/test_inventory.py
          tests/test_sales.py
          tests/test_invoices.py
          tests/test_sync_foundation.py
          tests/test_deployment_modes.py
      # Keep the non-demo migration fixture intact. Assert the guard on that
      # database, then test the reseed flow on a separate CI-only database.
      - name: Verify reseed refuses to modify preserved business data
        working-directory: backend
        env:
          DEPLOYMENT_MODE: local_hub
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          SECRET_KEY: github-actions-p1-only
        run: |
          if python -m scripts.seed_multi_venture --reset > "$RUNNER_TEMP/p1-seed-guard.log" 2>&1; then
            echo "Reseeding unexpectedly accepted a non-demo database" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/p1-seed-guard.log"
          grep -Fq 'Demo seed/reset refused: non-demo business data exists.' "$RUNNER_TEMP/p1-seed-guard.log"
          python scripts/verify_p1_migration.py verify
      - name: Create isolated demo database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE hybrid_retail_bi_p1_demo;"
      - name: Verify multi-venture development seed and reseed
        working-directory: backend
        env:
          DEPLOYMENT_MODE: local_hub
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi_p1_demo
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi_p1_demo
          SECRET_KEY: github-actions-p1-only
        run: |
          alembic -c alembic.ini upgrade head
          python -m scripts.seed_multi_venture
          python -m scripts.seed_multi_venture --reset
      - name: Run complete backend regression
        working-directory: backend
        run: python -m pytest -q --disable-warnings
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app server.py scripts/verify_p1_migration.py scripts/seed_multi_venture.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
