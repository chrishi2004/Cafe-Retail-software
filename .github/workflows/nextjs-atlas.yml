name: Next.js Atlas rewrite checks
on:
  push:
    branches: [rewrite/nextjs-atlas]
  pull_request:
    branches: [rewrite/nextjs-atlas]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original Cafe source preservation
        run: python scripts/check_cafe_v1_baseline.py
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm test && npm run test:integration
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:browser
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
      - name: Preserved backend regression
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pytest backend/tests -q -rs
