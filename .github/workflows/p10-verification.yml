name: P10 Closing Audit Void Purge Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_retail_bi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hybrid_retail_bi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Apply Local Hub migrations through P10
        working-directory: backend
        env:
          DEPLOYMENT_MODE: local_hub
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          SECRET_KEY: github-actions-p10-only
        run: alembic -c alembic.ini upgrade head
      - name: Verify P10 migration and cloud separation
        working-directory: backend
        run: |
          alembic -c alembic.ini history | grep -q "20260817_0018"
          alembic -c alembic_cloud.ini history | grep -q "20260813_cloud_0001"
          test "$(alembic -c alembic.ini heads | awk '{print $1}')" != "$(alembic -c alembic_cloud.ini heads | awk '{print $1}')"
      - name: Run required P10 tests
        working-directory: backend
        run: >-
          python -m pytest -q --disable-warnings
          tests/test_business_day_closing.py
          tests/test_financial_voids.py
          tests/test_purge_workflow.py
          tests/test_purge_authorization.py
          tests/test_audit_immutability.py
      - name: Run P9 and continuity regression
        working-directory: backend
        run: >-
          python -m pytest -q --disable-warnings
          tests/test_cafe_dashboard.py
          tests/test_consolidated_dashboard.py
          tests/test_multi_venture_exports.py
          tests/test_cafe_ai_scope.py
          tests/test_cross_venture_isolation.py
          tests/test_cross_venture_exports_ai.py
          tests/test_scope_constraints.py
          tests/test_company_scope_auth.py
          tests/test_cafe_billing.py
          tests/test_cafe_payments.py
          tests/test_invoices.py
          tests/test_inventory.py
          tests/test_customer_ledger.py
          tests/test_dashboard.py
          tests/test_exports.py
          tests/test_hc4_reconciliation.py
          tests/test_hc4_recovery.py
      - name: Run complete backend regression
        working-directory: backend
        run: python -m pytest -q --disable-warnings
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app server.py scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify P10 boundary
        run: |
          grep -q 'governance' backend/app/api/routes/governance.py
          grep -q 'data-p10-scope' frontend/src/pages/CafeClosingPage.tsx
          grep -q 'data-p10-scope' frontend/src/pages/PurgeReviewPage.tsx
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_OPERATIONAL_API_BASE_URL: https://ops-api.example.invalid/api
        run: npm run build
