name: Full V2 baseline preservation
on:
  push:
    branches: [release/full-v2]
  pull_request:
    branches: [release/full-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preservation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Dedicated ephemeral service, never an installed customer database.
      CAFE_PRODUCTION_TEST_ADMIN_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/postgres
      CAFE_RELEASE_BROWSER: '1'
      KALPVRIK_DATA_DIR: /tmp/full-v2-ci-data
      SECRET_KEY: isolated-ci-only-secret-not-for-production-123456789
      CAFE_PLAYWRIGHT_MODULE: '@playwright/test'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify frozen V1 ancestry, hashes and removals
        run: python scripts/check_cafe_v1_baseline.py
      - name: Build production frontend and run Cafe UI contracts
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          VITE_API_BASE_URL=http://127.0.0.1:8000/api npm run build
          node --test tests/cafe-v1.test.mjs
          npm install --no-save --package-lock=false @playwright/test@1.51.1
          npx playwright install --with-deps chromium
      - name: Resolve browser tooling for the existing V1 acceptance runner
        working-directory: frontend
        run: echo "CAFE_PLAYWRIGHT_MODULE=$(node -p 'require.resolve("@playwright/test")')" >> "$GITHUB_ENV"
      - name: Full regression including populated restore and real Cafe browser acceptance
        run: |
          test -n "$CAFE_PRODUCTION_TEST_ADMIN_URL"
          test "$CAFE_RELEASE_BROWSER" = 1
          python -m pytest backend/tests -q -rs
      - name: Expose known dependency audit gate
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
